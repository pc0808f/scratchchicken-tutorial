# GitHub Pages 設定檔
# Scratch 母雞護衛隊塔防課程教學網站

# 網站基本資訊
title: "Scratch 母雞護衛隊塔防課程"
description: "國小四、五年級程式設計創客教學 - 透過保衛飼料的塔防遊戲學習 Scratch 程式設計"
baseurl: "/scratchchicken-tutorial" # GitHub Pages 子目錄名稱
url: "https://pc0808f.github.io" # 替換為你的 GitHub Pages 網址

# 作者資訊
author: "創客教學團隊"

# 網站語言和地區
lang: zh-TW
locale: zh_TW

# Jekyll 主題設定
theme: minima
# 如果要使用 GitHub Pages 支援的主題，可以選擇：
# theme: jekyll-theme-cayman
# theme: jekyll-theme-minimal
# theme: jekyll-theme-architect
# theme: jekyll-theme-slate

# Markdown 處理器設定
markdown: kramdown
highlighter: rouge

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 網站導航選單
header_pages:
  - index.md
  - how-to-learn.md

# 網站設定
show_excerpts: true
paginate: 10

# 排除的檔案（不會出現在網站中）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - GitHub_Pages_設置指南.md
  - LICENSE
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - .gitignore

# 包含的檔案
include:
  - _pages

# 預設的 Front Matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "創客教學團隊"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# 社群媒體連結（可選）
social:
  - name: GitHub
    icon: github
    link: https://github.com/pc0808f/scratchchicken-tutorial

# 網站分析（可選）
# google_analytics: G-XXXXXXXXXX

# 搜尋引擎最佳化
seo:
  type: Website
  name: Scratch 母雞護衛隊塔防課程
  links:
    - https://pc0808f.github.io/scratchchicken-tutorial

# 自訂變數
custom:
  course_info:
    grade: "國小四、五年級"
    duration: "14週課程"
    time_per_week: "表定90分鐘，約45分鐘有效教學"
    platform: "Scratch 3.0"
  
  contact:
    teacher_name: "創客老師"
    line: "LINE 私訊老師"
    
  resources:
    scratch_url: "https://scratch.mit.edu/"
    course_materials: "/resources/"

# 課程結構
course_structure:
  - week: 1
    title: "初探 Scratch，守衛母雞誕生"
    status: "available"
    description: "認識 Scratch 介面，建立第一隻守衛母雞"
  - week: 2
    title: "老鼠來了！沿小路進攻"
    status: "available"
    description: "補完 Scratch 基礎，讓老鼠沿著小路移動"
  - week: 3
    title: "母雞就位！免費放置砲塔"
    status: "available"
    description: "點擊固定砲位，建立第一座守衛母雞砲塔"
  - week: 4
    title: "發射雞蛋！自動攻擊"
    status: "coming_soon"
    description: "用分身製作雞蛋，讓砲塔自動攻擊老鼠"
  - week: 5
    title: "砲塔美化與防呆"
    status: "coming_soon"
    description: "加入砲塔動畫，避免重複或錯誤放置"
  - week: 6
    title: "鼠潮生成器與第二種老鼠"
    status: "coming_soon"
    description: "用分身生成老鼠，加入速度不同的敵人"
  - week: 7
    title: "整合週：第一版可以玩的塔防"
    status: "coming_soon"
    description: "整合前六週功能，完成第一版塔防遊戲"
  - week: 8
    title: "波次系統：一波接一波"
    status: "coming_soon"
    description: "用變數和廣播控制一波又一波的老鼠進攻"
  - week: 9
    title: "金幣經濟：防守要花錢"
    status: "coming_soon"
    description: "建立金幣獎勵與砲塔購買機制"
  - week: 10
    title: "完整砲塔商店"
    status: "coming_soon"
    description: "設計商店，讓玩家選擇不同砲塔"
  - week: 11
    title: "第二種砲塔：戰鬥雞"
    status: "coming_soon"
    description: "調整射速與射程，製作不同特色的砲塔"
  - week: 12
    title: "血條與更多敵人"
    status: "coming_soon"
    description: "加入敵人血量、血條與難度變化"
  - week: 13
    title: "雷射母雞：穿透攻擊"
    status: "coming_soon"
    description: "製作能同時攻擊多隻老鼠的進階武器"
  - week: 14
    title: "生命值、Game Over、升級與成果發表"
    status: "coming_soon"
    description: "完成勝負系統、升級功能與塔防作品發表"
