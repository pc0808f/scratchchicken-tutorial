# GitHub Pages 設定檔
# Scratch 母雞護衛隊塔防課程教學網站
#
# ⚠️ 課程方向、週次、學習目標、成果標準的唯一設計標準是 `課綱.md`。
#    本檔的 course_structure、course_info 等課程內容必須與 `課綱.md` 一致；
#    如有衝突，以 `課綱.md` 為準。修改課程前請先讀 `課綱.md`。

# 網站基本資訊
title: "Scratch 母雞護衛隊塔防課程"
description: "國小四、五年級程式設計創客教學 - 透過保衛飼料的塔防遊戲學習 Scratch 程式設計"
baseurl: "/scratchchicken-tutorial" # GitHub Pages 子目錄名稱
url: "https://pc0808f.github.io" # 替換為你的 GitHub Pages 網址

# 作者資訊
author: "創客教學團隊"

# 網站語言和地區
lang: zh-TW
locale: zh_TW

# Jekyll 主題設定
theme: minima
# 如果要使用 GitHub Pages 支援的主題，可以選擇：
# theme: jekyll-theme-cayman
# theme: jekyll-theme-minimal
# theme: jekyll-theme-architect
# theme: jekyll-theme-slate

# Markdown 處理器設定
markdown: kramdown
highlighter: rouge

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 網站導航選單
header_pages:
  - index.md
  - how-to-learn.md

# 網站設定
show_excerpts: true
paginate: 10

# 排除的檔案（不會出現在網站中）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - README.md
  - GitHub_Pages_設置指南.md
  - LICENSE
  # 內部課程設計文件（不對外發布）
  - 課綱.md
  - 塔防課程轉換計畫.md
  - Fuelvin塔防教學系列摘要.md
  - 塔防課程與Fuelvin流程差異分析.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - .gitignore

# 包含的檔案
include:
  - _pages

# 預設的 Front Matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "創客教學團隊"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# 社群媒體連結（可選）
social:
  - name: GitHub
    icon: github
    link: https://github.com/pc0808f/scratchchicken-tutorial

# 網站分析（可選）
# google_analytics: G-XXXXXXXXXX

# 搜尋引擎最佳化
seo:
  type: Website
  name: Scratch 母雞護衛隊塔防課程
  links:
    - https://pc0808f.github.io/scratchchicken-tutorial

# 自訂變數
custom:
  course_info:
    grade: "國小四、五年級"
    duration: "14週課程"
    time_per_week: "表定90分鐘，約45分鐘有效教學"
    platform: "Scratch 3.0"
  
  contact:
    teacher_name: "創客老師"
    line: "LINE 私訊老師"
    
  resources:
    scratch_url: "https://scratch.mit.edu/"
    course_materials: "/resources/"

# 課程結構（以 `課綱.md` 第九節為準，與 _data/course_structure.yml 保持一致）
course_structure:
  - week: 1
    title: "初探 Scratch，守衛母雞誕生"
    status: "available"
    description: "認識 Scratch 介面，建立第一隻守衛母雞"
  - week: 2
    title: "建立塔防基地"
    status: "available"
    description: "補完介面與存檔，畫出老鼠洞、道路與飼料桶"
  - week: 3
    title: "老鼠上路①：直線前進"
    status: "available"
    description: "建立路徑角色與老鼠造型，讓老鼠沿路直線前進"
  - week: 4
    title: "老鼠上路②：轉彎與抵達"
    status: "available"
    description: "用老鼠身上的紅藍標壓到路線，讓老鼠轉彎走完全程，抵達飼料桶消失"
  - week: 5
    title: "母雞就位！免費放置砲塔"
    status: "available"
    description: "點擊固定砲位放置守衛母雞（本週先不扣錢）"
  - week: 6
    title: "發射雞蛋！自動攻擊"
    status: "coming_soon"
    description: "用分身製作雞蛋，攻擊並讓老鼠死亡消失"
  - week: 7
    title: "砲塔美化與防呆"
    status: "coming_soon"
    description: "加入砲塔動畫，避免放在路上或重複放置"
  - week: 8
    title: "鼠潮生成器與第二種老鼠"
    status: "coming_soon"
    description: "用分身生成老鼠，加入速度不同的第二種老鼠"
  - week: 9
    title: "整合週：第一版可以玩的塔防"
    status: "coming_soon"
    description: "整合前八週功能，測試除錯，完成第一版塔防遊戲"
  - week: 10
    title: "波次系統：一波接一波"
    status: "coming_soon"
    description: "用變數和廣播控制一波又一波的老鼠進攻"
  - week: 11
    title: "金幣經濟：防守要花錢"
    status: "coming_soon"
    description: "擊退老鼠賺金幣，回頭讓放置砲塔需要花錢"
  - week: 12
    title: "砲塔商店與第二種砲塔"
    status: "coming_soon"
    description: "設計商店，加入射速與射程不同的戰鬥雞砲塔"
  - week: 13
    title: "血條與更多敵人"
    status: "coming_soon"
    description: "用私有變數與畫筆做血條，加入難度變化"
  - week: 14
    title: "生命值、Game Over、升級與成果發表"
    status: "coming_soon"
    description: "完成勝負與升級系統並發表作品（雷射母雞為選修）"
